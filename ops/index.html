<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>9V CLEARANCE – Tactical Air-Law Shooter</title>
<style>
:root{--bg:#0b1220;--panel:#111b2e;--panel2:#18243b;--line:#2a3a58;--ink:#e8eef8;--dim:#93a3bd;--amber:#ffb020;--cyan:#35d0c8;--red:#ff5d73;--violet:#b48cff;--ok:#3ddc84;--mc:#ffb020}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:var(--bg);color:var(--ink);font-family:"Bahnschrift","DIN Alternate","Segoe UI",system-ui,-apple-system,sans-serif;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
b{color:#fff}
.cut{clip-path:polygon(0 0,calc(100% - 12px) 0,100% 12px,100% 100%,12px 100%,0 calc(100% - 12px))}
.btn{background:var(--amber);color:#111;border:0;padding:11px 22px;font-weight:800;letter-spacing:.08em;text-transform:uppercase;font-size:15px;clip-path:polygon(0 0,calc(100% - 10px) 0,100% 10px,100% 100%,10px 100%,0 calc(100% - 10px))}
.btn:hover:not(:disabled){filter:brightness(1.12)}.btn:active{transform:translateY(1px)}
.btn:disabled{opacity:.35;cursor:default}
.btn.ghost{background:var(--panel2);color:var(--ink);box-shadow:inset 0 0 0 1px var(--line)}
.btn.big{font-size:19px;padding:14px 34px}
.btn.t{background:var(--ok)}.btn.f{background:var(--red);color:#fff}
.eyebrow{font-size:12px;letter-spacing:.22em;text-transform:uppercase;color:var(--mc);font-weight:700}
h1,h2,h3{margin:0;text-transform:uppercase;letter-spacing:.04em;line-height:1.05}
/* ── overlay panels ── */
#ui{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px 16px;background:radial-gradient(ellipse at 50% 0,#1a2b4bcc,#070c16f2 70%)}
#ui.play{background:#070c16b8}
#panel{width:min(1040px,100%);margin:auto}
.box{background:var(--panel);border:1px solid var(--line);padding:22px 24px}
.grid{display:grid;gap:12px}
.row{display:flex;gap:12px;align-items:center;flex-wrap:wrap}
.sp{justify-content:space-between}
.muted{color:var(--dim)}
/* lobby */
.logo{font-size:clamp(40px,8vw,76px);font-weight:900;letter-spacing:.02em;line-height:.9}
.logo span{color:var(--amber)}
.lobby{display:grid;grid-template-columns:1.25fr 1fr;gap:16px;margin-top:16px}
.mcard{display:grid;grid-template-columns:auto 1fr auto;gap:14px;align-items:center;text-align:left;background:var(--panel2);border:1px solid var(--line);border-left:5px solid var(--mc);padding:13px 16px;width:100%}
.mcard:hover:not(:disabled){background:#20304e;border-color:var(--mc)}
.mcard:disabled{opacity:.45;cursor:default}
.mcard .code{font-size:12px;color:var(--mc);letter-spacing:.18em;font-weight:700}
.mcard .nm{font-size:19px;font-weight:800;text-transform:uppercase}
.mcard .tg{font-size:13px;color:var(--dim);margin-top:2px}
.mcard .st{font-size:20px;letter-spacing:2px;color:var(--amber);white-space:nowrap;text-align:right}
.mcard .st small{display:block;font-size:11px;color:var(--dim);letter-spacing:.08em}
.agents{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.agent{background:var(--panel2);border:1px solid var(--line);padding:10px 6px;text-align:center}
.agent .ic{font-size:26px}.agent .n{font-weight:800;letter-spacing:.1em;font-size:13px}
.agent.on{border-color:var(--ac);box-shadow:inset 0 -4px 0 var(--ac);background:#20304e}
.adesc{font-size:13.5px;line-height:1.5;min-height:92px;margin-top:10px}
.adesc kbd,.keys kbd,kbd{display:inline-block;background:#0b1220;border:1px solid var(--line);border-bottom-width:2px;padding:0 6px;font:inherit;font-size:12px;font-weight:700;color:var(--amber)}
input[type=text]{font:inherit;font-size:17px;background:#0b1220;border:1px solid var(--line);color:var(--ink);padding:9px 12px;width:100%}
input[type=range]{width:120px;accent-color:var(--amber)}
.seg{display:inline-flex;border:1px solid var(--line)}.seg button{background:transparent;border:0;padding:6px 12px;font-size:13px;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--dim)}.seg button.on{background:var(--amber);color:#111}
.keys{font-size:13px;line-height:1.9;color:var(--dim)}
/* intel */
.intel{border-left:6px solid var(--mc);min-height:250px;font-size:17px;line-height:1.55}
.intel h2{font-size:26px;margin:4px 0 12px}
.intel ul{margin:6px 0 0;padding-left:22px}.intel li{margin:4px 0}
.src{float:right;font-size:12px;color:var(--dim);letter-spacing:.08em;font-weight:700}
.dots{display:flex;gap:6px}.dots i{width:22px;height:4px;background:var(--line)}.dots i.on{background:var(--mc)}
/* buy */
.buy{display:grid;grid-template-columns:1fr 1.15fr;gap:14px}
.recon{border-left:6px solid var(--mc)}
.recon .stmt{font-size:19px;line-height:1.4;margin:10px 0 14px;font-weight:600}
.fb{margin-top:12px;padding:10px 12px;font-size:14.5px;line-height:1.45;border-left:4px solid}
.fb.ok{background:#12301f;border-color:var(--ok)}.fb.bad{background:#3a1820;border-color:var(--red)}
.shop{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.item{background:var(--panel2);border:1px solid var(--line);padding:9px 11px;text-align:left;display:grid;grid-template-columns:1fr auto;gap:2px 8px}
.item:hover:not(:disabled){border-color:var(--amber)}
.item:disabled{opacity:.4;cursor:default}
.item.own{border-color:var(--ok);opacity:1}
.item .n{font-weight:800;letter-spacing:.06em}.item .c{color:var(--amber);font-weight:800}
.item .d{grid-column:1/-1;font-size:12px;color:var(--dim)}
.cred{font-size:26px;font-weight:900;color:var(--amber)}
.qprev{font-size:15px;line-height:1.4;background:#0b1220;border:1px solid var(--line);padding:10px 12px}
/* round end */
.res{font-size:clamp(34px,7vw,60px);font-weight:900;letter-spacing:.04em}
.res.win{color:var(--ok)}.res.lose{color:var(--red)}
.ans{background:#12301f;border-left:5px solid var(--ok);padding:12px 14px;font-size:18px;font-weight:700;margin:10px 0}
.why{font-size:15.5px;line-height:1.5;color:#cfd9ea}
.stats{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;margin:14px 0}
.stat{background:var(--panel2);padding:10px;text-align:center}.stat b{display:block;font-size:26px}.stat span{font-size:11px;letter-spacing:.14em;color:var(--dim);text-transform:uppercase}
.miss{font-size:14px;line-height:1.45;border-left:3px solid var(--red);padding:6px 10px;background:var(--panel2);margin-top:6px}
.cert{border:2px solid var(--amber);padding:22px;text-align:center;background:linear-gradient(180deg,#1b2740,#111b2e)}
.cert .nm{font-size:32px;font-weight:900;color:var(--amber);border-bottom:2px solid var(--amber);display:inline-block;padding:0 18px;margin:8px 0}
/* ── HUD ── */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5;text-shadow:0 1px 3px #000c}
#top{position:absolute;left:50%;top:8px;transform:translateX(-50%);display:flex;align-items:stretch;gap:2px}
#top div{background:#0b1220cc;padding:5px 14px;text-align:center;min-width:74px}
#top small{display:block;font-size:10px;letter-spacing:.16em;color:var(--dim)}
#top b{font-size:22px}
#timer b{color:var(--amber)}#timer.low b{color:var(--red)}
#qbar{position:absolute;left:50%;top:62px;transform:translateX(-50%);width:min(760px,calc(100vw - 500px));background:#0b1220d9;border-top:3px solid var(--mc);padding:8px 12px}
#qtext{font-size:16px;font-weight:700;line-height:1.3}
#qopts{display:grid;grid-template-columns:repeat(3,1fr);gap:6px;margin-top:7px}
.qo{background:#18243bd9;border-left:4px solid var(--sc);padding:5px 8px;font-size:13.5px;line-height:1.25}
.qo i{font-style:normal;font-weight:900;color:var(--sc);margin-right:6px;font-size:16px}
.qo.x{opacity:.4;text-decoration:line-through}
#mini{position:absolute;left:10px;top:10px;width:170px;height:118px;background:#0b1220c0;border:1px solid var(--line)}
#feed{position:absolute;right:10px;top:10px;width:230px;font-size:12.5px;display:flex;flex-direction:column;align-items:flex-end;gap:3px}
#feed div{background:#0b1220c0;padding:3px 8px;border-right:3px solid var(--amber);text-align:right}
#vit{position:absolute;left:14px;bottom:14px;display:flex;gap:14px;align-items:flex-end}
#vit .v{background:#0b1220cc;padding:6px 14px}
#vit small{display:block;font-size:10px;letter-spacing:.16em;color:var(--dim)}
#hp{font-size:38px;font-weight:900;line-height:1}#hp.low{color:var(--red)}
#arm{font-size:24px;font-weight:800;color:var(--cyan);line-height:1}
#cred{font-size:20px;font-weight:800;color:var(--amber);line-height:1.2}
#gun{position:absolute;right:14px;bottom:14px;background:#0b1220cc;padding:6px 14px;text-align:right}
#ammo{font-size:38px;font-weight:900;line-height:1}#ammo small{font-size:18px;color:var(--dim)}
#wname{font-size:12px;letter-spacing:.16em;color:var(--dim)}
#abil{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:8px}
.ab{background:#0b1220cc;border-bottom:3px solid var(--line);padding:5px 12px;text-align:center;min-width:108px;font-size:12px}
.ab b{display:block;font-size:13px;letter-spacing:.06em}
.ab.rdy{border-color:var(--amber)}.ab.rdy b{color:var(--amber)}
.ab .pips{letter-spacing:2px;color:var(--amber);font-size:10px}
#cross{position:absolute;left:50%;top:50%;width:0;height:0}
#cross i{position:absolute;background:#fff;box-shadow:0 0 2px #000}
#cross i:nth-child(1){left:-1px;top:-1px;width:2px;height:2px}
#cross i:nth-child(2){width:8px;height:2px;top:-1px;left:calc(var(--g)*-1 - 8px)}
#cross i:nth-child(3){width:8px;height:2px;top:-1px;left:var(--g)}
#cross i:nth-child(4){width:2px;height:8px;left:-1px;top:calc(var(--g)*-1 - 8px)}
#cross i:nth-child(5){width:2px;height:8px;left:-1px;top:var(--g)}
#hitm{position:absolute;left:50%;top:50%;width:26px;height:26px;margin:-13px;opacity:0;background:linear-gradient(45deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%),linear-gradient(-45deg,transparent 44%,#fff 44%,#fff 56%,transparent 56%)}
#hitm.k{background:linear-gradient(45deg,transparent 42%,var(--red) 42%,var(--red) 58%,transparent 58%),linear-gradient(-45deg,transparent 42%,var(--red) 42%,var(--red) 58%,transparent 58%)}
#dmg{position:absolute;inset:0;background:radial-gradient(transparent 45%,#ff1f3d99);opacity:0}
#banner{position:absolute;left:50%;top:27%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .25s}
#banner b{display:block;font-size:clamp(30px,6vw,56px);font-weight:900;letter-spacing:.1em}
#banner span{font-size:16px;letter-spacing:.14em;color:var(--amber)}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:#0b1220d9;padding:8px 16px;font-size:16px;font-weight:700;text-align:center;min-width:250px}
#pbar{height:6px;background:#ffffff22;margin-top:6px}#pfill{height:100%;width:0;background:var(--amber)}
#pause{position:fixed;inset:0;z-index:15;background:#070c16cc;display:flex;align-items:center;justify-content:center;text-align:center;cursor:pointer}
/* touch */
#touch{position:absolute;inset:0}
#stick{position:absolute;left:22px;bottom:86px;width:120px;height:120px;border-radius:50%;background:#ffffff1f;border:2px solid #fff6;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:35px;top:35px;width:50px;height:50px;border-radius:50%;background:#ffffffb0}
.tb{position:absolute;width:58px;height:58px;border-radius:50%;background:#0b1220c0;border:2px solid #fff8;font-weight:800;font-size:12px;pointer-events:auto;touch-action:none;color:#fff}
#tFire{right:22px;bottom:96px;width:84px;height:84px;background:#ff5d73b0;font-size:15px}
@media(max-width:1100px){#feed{display:none}#qbar{width:min(760px,calc(100vw - 380px))}}
@media(max-width:900px){.lobby,.buy{grid-template-columns:1fr}#qbar{width:calc(100vw - 20px);top:58px}#mini{top:auto;bottom:216px;width:120px;height:84px}#feed{display:none}.stats{grid-template-columns:repeat(2,1fr)}#qtext{font-size:13.5px}.qo{font-size:11.5px}#abil{bottom:74px}.ab{min-width:80px}}
@media(max-height:520px){#qbar{top:4px;left:calc(50% + 0px)}#top{left:auto;right:8px;transform:none;top:auto;bottom:8px;display:none}}
</style>
</head>
<body>
<canvas id="c"></canvas>

<div id="hud" class="hidden">
  <canvas id="mini" width="340" height="236"></canvas>
  <div id="top">
    <div><small>CLEARED</small><b id="sW">0</b></div>
    <div id="timer"><small id="rlab">ROUND 1</small><b id="tclock">1:40</b></div>
    <div><small>FAILED</small><b id="sL">0</b></div>
    <div><small>HOSTILES</small><b id="sE">0</b></div>
  </div>
  <div id="qbar"><div id="qtext"></div><div id="qopts"></div></div>
  <div id="feed"></div>
  <div id="vit">
    <div class="v"><small>HEALTH</small><div id="hp">100</div></div>
    <div class="v"><small>ARMOUR</small><div id="arm">0</div></div>
    <div class="v"><small>CREDITS</small><div id="cred">0</div></div>
  </div>
  <div id="abil"></div>
  <div id="gun"><div id="wname">PITOT</div><div id="ammo">12<small>/12</small></div></div>
  <div id="cross" style="--g:5px"><i></i><i></i><i></i><i></i><i></i></div>
  <div id="hitm"></div>
  <div id="dmg"></div>
  <div id="banner"><b></b><span></span></div>
  <div id="prompt" class="hidden"><span id="ptext"></span><div id="pbar"><div id="pfill"></div></div></div>
  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <button class="tb" id="tFire">FIRE</button>
    <button class="tb" id="tUse" style="right:118px;bottom:92px;background:#ffb020b0;color:#111">HOLD<br>CERT</button>
    <button class="tb" id="tE" style="right:22px;bottom:192px">ABIL</button>
    <button class="tb" id="tX" style="right:88px;bottom:176px">ULT</button>
    <button class="tb" id="tR" style="right:154px;bottom:160px">RLD</button>
    <button class="tb" id="tS" style="right:184px;bottom:92px">SWAP</button>
  </div>
</div>

<div id="pause" class="hidden"><div><div class="eyebrow">Paused</div><h1 style="font-size:44px;margin:8px 0">Click to resume</h1><div class="muted">Your mouse was released. Click anywhere to lock back in.</div><button class="btn ghost" id="quitBtn" style="margin-top:22px">Quit to lobby</button></div></div>

<div id="ui"><div id="panel"></div></div>

<script src="../game/three.min.js"></script>
<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
