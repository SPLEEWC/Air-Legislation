<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Pencil Whip – Vista Bay</title>
<style>
:root{--ink:#fff;--dim:#c8cfdb;--cash:#5fe36a;--gold:#ffc83d;--pink:#ff6fc8;--blue:#4fc3ff;--red:#ff4b4b;--panel:#0d1424f2;--line:#2c3a56;--big:"Impact","Haettenschweiler","Arial Narrow Bold","Franklin Gothic Heavy",sans-serif}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;height:100%;overflow:hidden;background:#000;color:var(--ink);font-family:"Segoe UI",system-ui,-apple-system,Roboto,sans-serif;user-select:none;-webkit-user-select:none}
canvas#c{position:fixed;inset:0;width:100%;height:100%;display:block;touch-action:none}
.hidden{display:none!important}
button{font:inherit;color:inherit;cursor:pointer}
b{color:#fff}
.out{text-shadow:-2px -2px 0 #000,2px -2px 0 #000,-2px 2px 0 #000,2px 2px 0 #000,0 3px 6px #000c}
.sh{text-shadow:0 1px 2px #000,0 0 6px #000a}
/* HUD */
#hud{position:fixed;inset:0;pointer-events:none;z-index:5}
#mini{position:absolute;left:18px;bottom:18px;width:190px;height:190px;border-radius:50%;border:4px solid #0b0f18;box-shadow:0 0 0 2px #ffffff55,0 6px 18px #000a;background:#2a3a2a}
#speed{position:absolute;left:214px;bottom:24px;font:900 30px/1 var(--big);letter-spacing:1px}
#speed small{font-size:14px;color:var(--dim)}
#tr{position:absolute;right:20px;top:14px;text-align:right}
#cash{font:400 40px/1 var(--big);color:var(--cash);letter-spacing:2px}
#stars{font-size:30px;letter-spacing:2px;line-height:1.1;margin-top:2px;color:#ffffff40}
#stars i{font-style:normal}#stars i.on{color:#fff}#stars.flash i.on{animation:fl .5s steps(2) infinite}
@keyframes fl{50%{color:#ffffff40}}
#rank{font:400 17px var(--big);letter-spacing:1px;color:var(--gold);margin-top:2px}
#timer{font:400 34px var(--big);color:#fff;margin-top:6px}#timer.low{color:var(--red)}
#chase{margin-top:6px;font:400 18px var(--big);letter-spacing:1px}
#chase .bar{width:170px;height:10px;background:#0008;border:2px solid #000;margin:4px 0 0 auto}#chase .bar i{display:block;height:100%;background:var(--red)}
#help{position:absolute;left:18px;top:14px;max-width:min(380px,60vw);background:#000c;border-radius:4px;padding:10px 14px;font-size:15px;line-height:1.45;transition:opacity .25s}
#help kbd,.k{display:inline-block;background:#fff;color:#000;border-radius:3px;padding:0 6px;font:700 13px/1.5 system-ui;margin:0 1px}
#obj{position:absolute;left:50%;bottom:24px;transform:translateX(-50%);width:min(760px,calc(100vw - 460px));text-align:center;font-size:20px;font-weight:600;line-height:1.35}
#obj b{color:var(--gold)}
#veh{position:absolute;right:22px;bottom:22px;text-align:right;opacity:0;transition:opacity .5s}
#veh .n{font:400 34px var(--big);letter-spacing:2px;color:#9fd3ff}
#veh .r{font:400 18px var(--big);letter-spacing:1px;color:var(--gold)}
#ticker{position:absolute;right:22px;bottom:96px;width:min(420px,40vw);font-size:13px;text-align:right;color:var(--dim);opacity:0;transition:opacity .4s}
#big{position:absolute;left:50%;top:30%;transform:translate(-50%,-50%);text-align:center;opacity:0;transition:opacity .35s;white-space:nowrap}
#big .t{font:400 clamp(44px,8vw,86px)/1 var(--big);letter-spacing:2px;color:var(--gold)}
#big .s{font:400 clamp(24px,4vw,40px)/1.2 var(--big);letter-spacing:2px;color:#fff;margin-top:6px}
#big.fail .t{color:var(--red)}#big.bust .t{color:#4fa3ff}
#toast{position:absolute;left:50%;top:14px;transform:translateX(-50%);max-width:min(560px,70vw);background:#000c;border-left:5px solid var(--gold);padding:8px 14px;font-size:15px;line-height:1.4;opacity:0;transition:opacity .3s}
#toast.show{opacity:1}
#prompt{position:absolute;left:50%;top:62%;transform:translateX(-50%);background:#000b;padding:6px 14px;border-radius:4px;font-size:16px;font-weight:600}
/* cutscene */
.lb{position:fixed;left:0;right:0;height:11vh;background:#000;z-index:8;transition:transform .35s}
#lbT{top:0;transform:translateY(-100%)}#lbB{bottom:0;transform:translateY(100%)}
body.cut #lbT,body.cut #lbB{transform:none}
#sub{position:fixed;left:50%;bottom:calc(11vh + 18px);transform:translateX(-50%);width:min(900px,calc(100vw - 32px));z-index:9;text-align:center;font-size:clamp(17px,2.2vw,22px);line-height:1.45;font-weight:600}
#sub .who{font-weight:800;margin-right:6px}
#sub .note{display:inline-block;margin-top:8px;font-size:13px;font-weight:700;color:#000;background:var(--gold);padding:2px 10px;border-radius:3px}
#subnav{position:fixed;right:16px;bottom:calc(11vh/2 - 16px);z-index:9;display:flex;gap:10px;align-items:center;font-size:13px;color:var(--dim)}
.sbtn{background:transparent;border:1px solid #fff6;border-radius:3px;padding:5px 12px;font-size:13px;font-weight:700;letter-spacing:.06em}
/* panels */
#ui{position:fixed;inset:0;z-index:20;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:18px 16px;background:#000b}
#panel{width:min(820px,100%);margin:auto}
.card{background:var(--panel);border:1px solid var(--line);border-top:5px solid var(--tc,var(--gold));padding:22px 24px;border-radius:4px}
.ey{font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--tc,var(--gold));font-weight:800}
h1,h2{margin:0;font-family:var(--big);font-weight:400;letter-spacing:1.5px}
h2{font-size:34px;margin:4px 0 10px}
.q{font-size:19px;font-weight:700;line-height:1.4;margin:6px 0 4px}
.opts{display:grid;gap:9px;margin-top:12px}
.opt{background:#18233a;border:2px solid #2f4266;border-radius:4px;padding:12px 14px;text-align:left;font-size:16px;font-weight:600}
.opt:hover:not(:disabled){border-color:var(--gold)}
.opt.ok{background:#173d22;border-color:#5fe36a}.opt.bad{background:#40181c;border-color:var(--red);opacity:.75}
.opt.sel{border-color:var(--gold);background:#2d2a14}
.fb{margin-top:12px;padding:10px 12px;border-left:4px solid;font-size:15px;line-height:1.45}
.fb.ok{background:#14301c;border-color:#5fe36a}.fb.bad{background:#3a1519;border-color:var(--red)}
.row{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:16px}.sp{justify-content:space-between}
.btn{background:var(--gold);color:#111;border:0;border-radius:3px;padding:11px 22px;font:400 20px var(--big);letter-spacing:1.5px}
.btn:hover:not(:disabled){filter:brightness(1.1)}.btn:disabled{opacity:.35;cursor:default}
.btn.g{background:#24324d;color:#fff}
.srt{display:grid;grid-template-columns:1fr auto;gap:8px;align-items:center;background:#18233a;border-radius:4px;padding:8px 10px;margin-top:8px;font-weight:600}
.srt .bins{display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}
.bin{background:#24324d;border:2px solid transparent;border-radius:3px;padding:5px 10px;font-size:13px;font-weight:700}
.bin.on{border-color:var(--gold);background:#3a3417}
.bin.ok{border-color:#5fe36a;background:#173d22}.bin.bad{border-color:var(--red);background:#40181c}
.muted{color:var(--dim)}
/* title & menus */
.logo{font:400 clamp(56px,11vw,120px)/.9 var(--big);letter-spacing:3px;color:#fff}
.logo span{color:var(--gold)}
.tabs{display:flex;gap:4px;flex-wrap:wrap;margin:10px 0 14px}
.tab{background:#18233a;border:0;padding:8px 14px;font:400 18px var(--big);letter-spacing:1px;border-radius:3px}
.tab.on{background:var(--gold);color:#111}
.fact{background:#18233a;border-left:4px solid var(--tc);padding:8px 12px;margin-top:6px;font-size:14.5px;line-height:1.45;border-radius:3px}
.fact.lk{opacity:.35;font-style:italic}
.fact small{float:right;color:var(--dim);font-size:11.5px;margin-left:8px}
.ml{display:grid;grid-template-columns:auto 1fr auto;gap:10px;align-items:center;background:#18233a;padding:8px 12px;border-radius:3px;margin-top:6px}
.ml .l{font:400 22px var(--big);width:30px;height:30px;display:grid;place-items:center;border-radius:50%;color:#000}
input[type=text]{font:inherit;font-size:18px;background:#0b111e;border:1px solid var(--line);color:#fff;padding:10px 12px;width:100%;border-radius:3px}
.cert{border:3px solid var(--gold);padding:22px;text-align:center;background:linear-gradient(180deg,#1b2440,#0d1424);border-radius:4px}
.cert .nm{font:400 40px var(--big);letter-spacing:2px;color:var(--gold);border-bottom:2px solid var(--gold);display:inline-block;padding:0 18px;margin:6px 0}
.keys{font-size:14px;line-height:2;color:var(--dim)}
/* touch */
#touch{position:absolute;inset:0}
#stick{position:absolute;left:24px;bottom:30px;width:130px;height:130px;border-radius:50%;background:#ffffff1c;border:2px solid #fff6;pointer-events:auto;touch-action:none}
#knob{position:absolute;left:38px;top:38px;width:54px;height:54px;border-radius:50%;background:#ffffffb0}
.tb{position:absolute;width:62px;height:62px;border-radius:50%;background:#000a;border:2px solid #fff8;font-weight:800;font-size:12px;pointer-events:auto;touch-action:none;color:#fff}
@media(max-width:900px){#obj{width:calc(100vw - 32px);bottom:auto;top:96px;font-size:15px}#mini{width:120px;height:120px;left:auto;right:12px;bottom:auto;top:130px}#speed{left:auto;right:16px;top:258px;bottom:auto;font-size:22px}#help{font-size:13px;max-width:55vw}#cash{font-size:30px}#stars{font-size:22px}#veh{bottom:auto;top:300px}#ticker{display:none}}
/* touch layout: keep HUD clear of the on-screen controls */
body.touch #mini{left:12px;top:12px;bottom:auto;right:auto;width:118px;height:118px}
body.touch #speed{left:16px;top:138px;bottom:auto;right:auto;font-size:22px}
body.touch #help{left:142px;top:12px;max-width:min(360px,40vw);font-size:13px;padding:8px 10px}
body.touch #tr{right:136px;top:10px}body.touch #cash{font-size:28px}body.touch #stars{font-size:20px}body.touch #rank{font-size:14px}body.touch #timer{font-size:26px}
body.touch #veh{right:136px;top:110px;bottom:auto}body.touch #veh .n{font-size:22px}body.touch #veh .r{font-size:14px}
body.touch #obj{bottom:12px;top:auto;width:calc(100vw - 380px);min-width:220px;font-size:14px}
body.touch #toast{top:auto;bottom:70px;font-size:13px}
body.touch #prompt{top:auto;bottom:60px;font-size:14px}
body.touch #ticker{display:none}
</style>
</head>
<body>
<canvas id="c"></canvas>
<div id="hud" class="hidden">
  <canvas id="mini" width="380" height="380"></canvas>
  <div id="speed" class="out hidden"></div>
  <div id="tr" class="out">
    <div id="cash">$00000000</div>
    <div id="stars"><i>★</i><i>★</i><i>★</i><i>★</i><i>★</i></div>
    <div id="rank"></div>
    <div id="timer" class="hidden"></div>
    <div id="chase" class="hidden"><span id="chaseT"></span><div class="bar"><i id="chaseF"></i></div></div>
  </div>
  <div id="help" style="opacity:0"></div>
  <div id="obj" class="out"></div>
  <div id="veh" class="out"><div class="n" id="vehN"></div><div class="r" id="vehR"></div></div>
  <div id="ticker" class="sh"></div>
  <div id="prompt" class="hidden"></div>
  <div id="toast"></div>
  <div id="big" class="out"><div class="t"></div><div class="s"></div></div>
  <div id="touch" class="hidden">
    <div id="stick"><div id="knob"></div></div>
    <button class="tb" id="tF" style="right:24px;bottom:120px;background:#ffc83dcc;color:#000">ENTER<br>EXIT</button>
    <button class="tb" id="tB" style="right:24px;bottom:38px;background:#ff4b4bb0">BRAKE</button>
    <button class="tb" id="tH" style="right:100px;bottom:38px">HORN</button>
    <button class="tb" id="tM" style="right:12px;top:12px;width:48px;height:48px">☰</button>
    <button class="tb" id="tC" style="right:68px;top:12px;width:48px;height:48px">CAM</button>
  </div>
</div>
<div class="lb" id="lbT"></div><div class="lb" id="lbB"></div>
<div id="sub" class="out hidden"></div>
<div id="subnav" class="hidden"><span id="subhint">Click / Space ▸</span><button class="sbtn" id="skip">SKIP</button></div>
<div id="ui"><div id="panel"></div></div>
<script src="../game/three.min.js"></script>
<script src="content.js"></script>
<script src="game.js"></script>
</body>
</html>
